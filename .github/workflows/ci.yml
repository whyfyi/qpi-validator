name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile uhd/scripts/*.py
      - name: Smoketest
        run: python uhd/scripts/physics_smoketest.py
