name: primesieve receipts (twin primes)

on:
  workflow_dispatch:
    inputs:
      N:
        description: "Upper bound N (e.g. 1000000000000 for 1e12)"
        required: true
        default: "1000000000000"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install primesieve
        run: |
          sudo apt-get update
          sudo apt-get install -y primesieve-bin

      - name: Generate receipt
        env:
          N: ${{ github.event.inputs.N }}
        run: |
          set -euo pipefail
          python3 scripts/primesieve_receipt.py "$N"

      - name: Upload receipt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: primesieve-receipt-${{ github.event.inputs.N }}
          path: |
            results/primesieve_twin_count_*.json
            results/primesieve_twin_count_*.sha256
